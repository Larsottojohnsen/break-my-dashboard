name: Verify CLI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright@1.65.1 install --with-deps chromium
      - run: npm run test:browser
      - run: node tests/package-smoke.mjs
      - name: Generate synthetic report
        shell: bash
        run: |
          set +e
          node dist/cli.js demo --out results/broken
          code=$?
          set -e
          test "$code" -eq 1
          node dist/cli.js demo --fixed --out results/fixed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-evidence-${{ matrix.os }}
          path: |
            results/
            package-lock.json
            *.tgz
