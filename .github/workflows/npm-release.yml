name: Prepare or publish npm
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch or version tag
        required: true
        default: main
        type: string
      publish:
        description: Publish the verified tarball using the configured npm trusted publisher
        required: true
        default: false
        type: boolean
concurrency:
  group: npm-release-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REF: ${{ github.event.release.tag_name || inputs.ref }}
      PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'release' || inputs.publish) && format('refs/tags/{0}', github.event.release.tag_name || inputs.ref) || inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check package and publication ref
        id: package
        run: |
          node -e "const p=require('./package.json');if(p.name!=='@larsottojohnsen/break-my-dashboard')throw Error('Unexpected package');if(process.env.PUBLISH==='true'&&process.env.SOURCE_REF!=='v'+p.version)throw Error('Publish from the matching version tag');"
          node -e "const fs=require('fs');const p=require('./package.json');fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+p.version+'\ntag='+(p.version.includes('-')?'next':'latest')+'\n');"
          npm --version
      - name: Verify npm trusted publisher authentication
        run: |
          node --input-type=module <<'NODE'
          // Exercise the same package-scoped exchange used by npm trusted publishing.
          // Tokens stay in memory and response bodies are never written to the log.
          const audienceUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          audienceUrl.searchParams.set("audience", "npm:registry.npmjs.org");
          const identityResponse = await fetch(audienceUrl, {
            headers: {
              authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`,
            },
            signal: AbortSignal.timeout(30000),
          });
          if (!identityResponse.ok) {
            throw new Error(
              `GitHub OIDC request failed with HTTP ${identityResponse.status}`,
            );
          }
          const identity = await identityResponse.json();
          if (typeof identity.value !== "string" || !identity.value) {
            throw new Error("GitHub did not return an OIDC token");
          }
          const packageName = "@larsottojohnsen/break-my-dashboard";
          const exchangeResponse = await fetch(
            `https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(packageName)}`,
            {
              method: "POST",
              headers: { authorization: `Bearer ${identity.value}` },
              signal: AbortSignal.timeout(30000),
            },
          );
          if (exchangeResponse.status !== 201) {
            throw new Error(
              `npm trusted publisher exchange failed with HTTP ${exchangeResponse.status}`,
            );
          }
          const exchange = await exchangeResponse.json();
          if (
            exchange.token_type !== "oidc" ||
            typeof exchange.token !== "string" ||
            !exchange.token
          ) {
            throw new Error("npm did not return a package-scoped OIDC token");
          }
          console.log(`Verified npm trusted publisher authentication for ${packageName}`);
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright@1.65.1 install --with-deps chromium
      - run: npm run test:browser
      - name: Build publication artifact
        id: pack
        run: |
          mkdir release-artifacts
          npm pack --json > release-artifacts/pack.json
          node -e "const fs=require('fs');const [p]=JSON.parse(fs.readFileSync('release-artifacts/pack.json','utf8'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'tarball='+p.filename+'\n');"
      - name: Test the exact tarball in an independent consumer
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node tests/package-smoke.mjs "$TARBALL"
      - run: node scripts/release-manifest.mjs
      - name: Validate npm publication
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --dry-run --access public --ignore-scripts
      - name: Check whether the version is already published
        id: registry
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const name = '@larsottojohnsen/break-my-dashboard';
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(process.env.VERSION)}`, { signal: AbortSignal.timeout(30000) });
          if (!response.ok && response.status !== 404) throw Error(`Registry lookup failed with HTTP ${response.status}`);
          const exists = response.ok;
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${exists}\n`);
          if (exists) console.log(`Version ${process.env.VERSION} is already published. Release retry completed.`);
          NODE
      - name: Publish npm package
        if: env.PUBLISH == 'true' && steps.registry.outputs.exists != 'true'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          NPM_TAG: ${{ steps.package.outputs.tag }}
        run: npm publish "$TARBALL" --access public --provenance --ignore-scripts --tag "$NPM_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-release-artifacts
          path: |
            *.tgz
            release-artifacts/
